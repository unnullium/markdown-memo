<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tools</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent-color: #7c3aed;
      --border-color: #e0e0e0;
    }

    [data-theme="dark"] {
      --bg-primary: #1e1e1e;
      --bg-secondary: #252525;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent-color: #a78bfa;
      --border-color: #3a3a3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .theme-toggle {
      font-size: 20px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }

    .theme-toggle:hover {
      background-color: var(--bg-secondary);
    }

    .tools-list {
      list-style: none;
    }

    .tools-list li {
      border-bottom: 1px solid var(--border-color);
    }

    .tools-list a {
      display: block;
      padding: 16px 0;
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .tools-list a:hover {
      color: var(--accent-color);
    }

    .tool-name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .tool-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Tools</h1>
      <button class="theme-toggle" id="themeToggle" title="テーマ切り替え">🌙</button>
    </header>

    <ul class="tools-list">
      <li>
        <a href="markdown-memo.html">
          <div class="tool-name">📝 Markdown Memo</div>
          <div class="tool-desc">Obsidian風マークダウンメモアプリ</div>
        </a>
      </li>
      <li>
        <a href="sample.html">
          <div class="tool-name">🔧 Sample Tool</div>
          <div class="tool-desc">サンプルツール（準備中）</div>
        </a>
      </li>
    </ul>

    <footer>
      GitHub Pages で公開中
    </footer>
  </div>

  <script>
    const THEME_KEY = 'my-tools-theme';
    const themeToggle = document.getElementById('themeToggle');

    function getTheme() {
      return localStorage.getItem(THEME_KEY) || 'light';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
      localStorage.setItem(THEME_KEY, theme);
    }

    themeToggle.addEventListener('click', () => {
      const current = getTheme();
      setTheme(current === 'light' ? 'dark' : 'light');
    });

    setTheme(getTheme());
  </script>
</body>
</html>
